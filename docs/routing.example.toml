# Example agent routing policy for herdr-dash (stage 1: preview only).
# Copy to ~/.config/herdr-projects/routing.toml (or $XDG_CONFIG_HOME/...)
# and change it to your own profiles. Nothing here is built in: every list
# is yours to order. A missing file, or enabled = false, means legacy
# launches (PROJECT.md thread_profile).
version = 1

[usage]
max_age_seconds = 900    # older usage readings count as stale: skipped
avoid_at_percent = 90    # a window at or over this is exhausted: skipped

[global]
enabled = false          # projects can opt in on their own (see below)

# Modes: planning, coding, crawl (crawl + summary). Each is an ordered list;
# the first candidate with fresh, known usage under the limit is chosen,
# unknown or stale usage skips to the next, none qualifying means "queue".
[[global.modes.planning]]
provider = "codex"
profile = "astra"

[[global.modes.coding]]
provider = "claude"
profile = "claude"

[[global.modes.coding]]
provider = "codex"
profile = "codex"

[[global.modes.crawl]]
provider = "opencode"    # only the self-hosted opencode default model;
profile = "opencode"     # a metered opencode provider is never used

# A project overrides whole lists (they never merge) and can opt in.
[projects.example-project]
enabled = true

[[projects.example-project.modes.coding]]
provider = "codex"
profile = "codex"

# A thread overrides lists for its next launch, per mode.
[[projects.example-project.threads.t-0001.modes.planning]]
provider = "claude"
profile = "claude"
