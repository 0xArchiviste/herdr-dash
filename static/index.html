<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1b19">
<title>herdr-dash</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2398bc37'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="voice.css">
<link rel="stylesheet" href="usage.css">
<link rel="stylesheet" href="system.css">
<link rel="stylesheet" href="prompts.css">
<link rel="stylesheet" href="windows.css">
<link rel="stylesheet" href="focus.css">
</head>
<body>
<header id="top">
  <h1 class="brand"><span id="live" class="live" title="live updates"></span>herdr<b>dash</b></h1>
  <div id="legend" class="legend"></div>
  <div class="updated" id="updated"></div>
</header>
<section id="filters">
  <div id="focus-box">
    <button id="f-project" class="fbtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="proj-picker" title="Focus projects (P)">All projects</button>
    <div id="proj-picker" role="dialog" aria-label="Focus projects" hidden>
      <div class="pp-head"><input id="pp-filter" type="search" placeholder="Filter projects…" aria-label="Filter projects" autocomplete="off"><button id="pp-done" class="tbtn" type="button">Done</button></div>
      <div class="pp-acts"><button id="pp-all" class="tbtn" type="button" title="Tick every project">All</button><button id="pp-none" class="tbtn" type="button" title="Untick every project: all show">None</button><label class="pp-fade" title="Unfocused projects stay on the map, faded"><input id="pp-fade" type="checkbox"> Fade others</label></div>
      <div id="pp-list" role="group" aria-label="Projects"></div>
      <p id="pp-note" class="pp-note"></p>
    </div>
  </div>
  <div id="focus-chips" aria-label="Focused projects" hidden></div>
  <select id="f-state" aria-label="State">
    <option value="">All states</option>
    <option value="needs">Needs you</option>
    <option value="working">Working</option>
    <option value="waiting">Waiting on you</option>
    <option value="blocked">Blocked</option>
    <option value="review">Ready for review</option>
    <option value="landing">Landing</option>
    <option value="idle">Idle</option>
    <option value="resolved">Resolved</option>
  </select>
  <select id="f-window" aria-label="Time window">
    <option value="">Any time</option>
    <option value="3600">Last hour</option>
    <option value="86400">Last 24h</option>
    <option value="604800">Last 7 days</option>
    <option value="2592000">Last 30 days</option>
  </select>
  <div id="search-box">
    <input id="f-search" type="search" placeholder="Search threads…" aria-label="Search" autocomplete="off">
    <button id="search-mode" class="tbtn" type="button" aria-pressed="false" title="Search thread titles (Alt+C toggles)">Title</button>
    <div id="search-results" role="listbox" aria-label="Content search results" hidden></div>
  </div>
  <button id="reset-filters" class="tbtn" hidden>Clear filters</button>
  <span id="shown" class="shown"></span>
</section>
<div id="workspace">
<section id="needs-wrap" aria-label="Needs your attention">
  <div class="needs-bar">
    <h2 class="needs-label">Needs you <span id="needs-n"></span></h2>
    <select id="needs-filter" aria-label="Acked and snoozed">
      <option value="active">Hide acked/snoozed</option>
      <option value="all">Show all</option>
      <option value="parked">Only acked/snoozed</option>
    </select>
    <button id="select-mode" class="tbtn w" aria-pressed="false">Select</button>
    <button id="bulk-ack" class="tbtn w" hidden>Ack selected</button>
    <button id="bulk-snooze" class="tbtn" hidden>Snooze 1 day</button>
    <button id="ack-all" class="tbtn w">Ack all review…</button>
  </div>
  <div id="needs"></div>
</section>
<div id="work">
<main id="stage">
  <div class="map-tools"><h2>Project map</h2><button id="fit-graph" class="tbtn" title="Fit all visible projects and threads">Fit graph</button></div>
  <div id="graph-empty" hidden role="status">No matching threads. Clear filters to see all work.</div>
  <svg id="graph" role="img" aria-label="Projects and threads"></svg>
  <div id="tip" class="tip" hidden></div>
  <div id="errors" class="errors" hidden></div>
</main>
<div id="splitter" role="separator" tabindex="0" aria-label="Resize panel" title="Drag to resize (double-click resets)" hidden></div>
<aside id="panel" aria-hidden="true">
  <div id="dock" role="group" aria-label="Dock panel">
    <button id="dock-left" class="dockbtn" data-pos="left" aria-pressed="false" title="Dock left" aria-label="Dock left"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><rect class="f" x="1.5" y="2.5" width="5" height="11" rx="1.5"/></svg></button>
    <button id="dock-bottom" class="dockbtn" data-pos="bottom" aria-pressed="false" title="Dock bottom" aria-label="Dock bottom"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><rect class="f" x="1.5" y="8.5" width="13" height="5" rx="1.5"/></svg></button>
    <button id="dock-right" class="dockbtn" data-pos="right" aria-pressed="true" title="Dock right" aria-label="Dock right"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><rect class="f" x="9.5" y="2.5" width="5" height="11" rx="1.5"/></svg></button>
  </div>
  <button id="pop-out" class="close" aria-label="Open in a window" title="Open in a window (several can be open side by side)">⧉</button>
  <button id="close" class="close" aria-label="Close">×</button>
  <div id="panel-body"></div>
</aside>
</div>
</div>
<dialog id="dlg">
  <form method="dialog">
    <div id="dlg-msg"></div>
    <div id="dlg-extra"></div>
    <menu><button id="dlg-cancel" value="cancel" class="tbtn">Cancel</button><button id="dlg-ok" value="ok" class="tbtn primary">OK</button></menu>
  </form>
</dialog>
<div id="toasts" aria-live="polite"></div>
<script src="d3.min.js"></script>
<script src="scrollback.js"></script>
<script src="windows.js"></script>
<script src="prompts.js"></script>
<script src="threadwin.js"></script>
<script src="app.js"></script>
<script src="voice.js"></script>
<script src="search.js"></script>
<script src="usage.js"></script>
<script src="system.js"></script>
</body>
</html>
